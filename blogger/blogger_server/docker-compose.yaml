services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: blogger
      POSTGRES_PASSWORD: "7ofQ1BI-hKjpSj5VkcmbgiXKC9Cm7duv"
    volumes:
      - blogger_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "T9kkerQJIJrzSM0iLCd5vH5RuGo0cmSX"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: blogger_test
      POSTGRES_PASSWORD: "2AARn8I6iHYuA-EEPVUE1O0YYqI1xgH4"
    volumes:
      - blogger_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "A0sPLozxieozcO0GAXFlWn1it2nki_KF"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  blogger_data:
  blogger_test_data:
